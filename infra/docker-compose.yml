services:
  postgres:
    image: postgres:18-alpine
    container_name: talomart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talomart}
      POSTGRES_USER: ${POSTGRES_USER:-talomart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talomart}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ../.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-talomart} -d ${POSTGRES_DB:-talomart}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: talomart-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ../.docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
